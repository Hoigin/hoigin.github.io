<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoigin's Blog</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --bg-card: rgba(255, 255, 255, 0.85);
            --text: #2c3e50;
            --text-secondary: #5a6a7a;
            --border: #dde3ea;
            --accent: #3498db;
            --hover-bg: rgba(52, 152, 219, 0.08);
            --avatar-shadow: rgba(0,0,0,0.12);
        }

        [data-theme="dark"] {
            --bg: #1a1a2e;
            --bg-card: rgba(30, 30, 50, 0.85);
            --text: #e0e0e0;
            --text-secondary: #a0a8b8;
            --border: #3a3a5e;
            --accent: #4aa3df;
            --hover-bg: rgba(74, 163, 223, 0.12);
            --avatar-shadow: rgba(255,255,255,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            position: relative;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--border);
            box-shadow: 0 2px 8px var(--avatar-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--text-secondary);
            overflow: hidden;
            transition: box-shadow 0.3s;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .blog-title {
            font-size: 2rem;
            letter-spacing: -0.5px;
            color: var(--text);
            transition: color 0.3s;
        }

        .theme-toggle {
            position: absolute;
            right: 0;
            top: 0;
            background: none;
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s, background 0.3s;
            color: var(--text);
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            background: var(--hover-bg);
        }

        /* Quote */
        .quote {
            color: var(--text-secondary);
            font-size: 1.1rem;
            padding: 15px 20px;
            background: var(--bg-card);
            border-radius: 6px;
            border-left: 3px solid var(--accent);
            margin-bottom: 30px;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        /* Article list */
        .post-list {
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            transition: background 0.3s, border-color 0.3s;
        }

        .post-list-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: color 0.3s, border-color 0.3s;
        }

        .post-item {
            display: block;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            transition: background 0.2s, color 0.3s, border-color 0.3s;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-item:hover {
            background: var(--hover-bg);
        }

        .post-item-title {
            font-size: 1rem;
            font-weight: 500;
        }

        .post-item-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
            transition: color 0.3s;
        }

        .post-list-empty {
            padding: 30px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            .blog-title { font-size: 1.6rem; }
            .avatar { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar">H</div>
            <h1 class="blog-title">Hoigin's Blog</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">☀️</button>
        </div>

        <div class="quote">思维是发散的，只有写下来才会收敛成文字。</div>

        <div class="post-list" id="postList">
<div class="post-list-header">文章列表</div>
<a class="post-item" href="./posts/20260506/post.html">
  <div class="post-item-title">关于思考与写作</div>
  <div class="post-item-date">2026-05-06</div>
</a>
<a class="post-item" href="./posts/20260504/post.html">
  <div class="post-item-title">极简博客搭建记录</div>
  <div class="post-item-date">2026-05-04</div>
</a>
</div>
    </div>

    <script>
        // 主题切换逻辑
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        // 读取本地存储的主题偏好
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('theme', next);
        });
    </script>
</body>
</html>
