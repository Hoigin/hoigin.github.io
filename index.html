<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" id="themeLight" href="./src/styles/light.css" media="all">
    <link rel="stylesheet" id="themeDark" href="./src/styles/dark.css" media="not all">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            position: relative;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--avatar-border);
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .blog-title {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--title-color);
            border-bottom: none;
            margin: 0;
        }

        .state {
            color: var(--state-color);
            font-size: 0.85em;
        }

        #dark-mode-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: transparent;
            border: none;
            padding: 4px;
            font-size: 1.4em;
            color: var(--toggle-color);
            cursor: pointer;
            transition: color 0.2s ease;
            z-index: 10;
            border-radius: 50%;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        #dark-mode-toggle:hover,
        #dark-mode-toggle:focus,
        #dark-mode-toggle:active {
            outline: none;
            background: transparent !important;
            box-shadow: none;
            color: var(--link-hover);
        }

        body {
            background-color: var(--page-bg);
            color: var(--page-text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 0 6px 20px var(--card-shadow);
            overflow: hidden;
            padding: 30px;
            position: relative;
        }

        .post-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            font-size: 1em;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-item:hover {
            color: var(--link-hover);
        }

        .post-title {
            color: var(--link-color);
            font-weight: bold;
        }

        .post-title::before {
            content: "📄 ";
            margin-right: 4px;
        }

        .post-item:hover .post-title {
            color: var(--link-hover);
        }

        .post-date {
            color: var(--muted-color);
            font-size: 0.85em;
            white-space: nowrap;
        }

        .no-posts {
            text-align: center;
            color: var(--muted-color);
            font-size: 1em;
            padding: 20px 0;
        }

        @media (max-width: 600px) {
            .card {
                padding: 18px;
            }
            .avatar {
                width: 60px;
                height: 60px;
            }
            .blog-title {
                font-size: 1.4em;
            }
            #dark-mode-toggle {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <img src="./resources/avatar.jpg" alt="Avatar" class="avatar">
                <div class="header-info">
                    <h1 class="blog-title">Hoigin's Blog</h1>
                    <div class="state">思维是发散的，只有写下来才会收敛成文字。</div>
                </div>
                <button id="dark-mode-toggle" aria-label="切换深色模式">☀️</button>
            </div>

            <div class="post-list">
                <a class="post-item" href="./posts/20260506/post.html">
                    <span class="post-title">关于思考与写作</span>
                    <span class="post-date">2026-05-06</span>
                </a>
                <a class="post-item" href="./posts/20260504/post.html">
                    <span class="post-title">极简博客搭建记录</span>
                    <span class="post-date">2026-05-04</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('dark-mode-toggle');
        const lightSheet = document.getElementById('themeLight');
        const darkSheet = document.getElementById('themeDark');

        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') {
            lightSheet.media = 'not all';
            darkSheet.media = 'all';
            themeToggle.textContent = '🌙';
        }

        themeToggle.addEventListener('click', () => {
            const isDark = darkSheet.media === 'all';
            lightSheet.media = isDark ? 'all' : 'not all';
            darkSheet.media = isDark ? 'not all' : 'all';
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        });
    </script>
</body>
</html>
