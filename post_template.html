<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>

    {{MATHJAX_CSS}}

    <link rel="stylesheet" href="../../src/font-family/open-sans.css">

    <!-- 文章通用样式（始终生效） -->
    <link rel="stylesheet" href="../../src/styles/posts.css">

    <!-- highlight.js 主题：浅色 / 深色，与博客主题同步切换 -->
    <link rel="stylesheet" id="hljsLight" href="../../src/styles/stackoverflow-light.min.css" media="not all">
    <link rel="stylesheet" id="hljsDark" href="../../src/styles/stackoverflow-dark.min.css" media="all">

    <!-- 博客主题：浅色 / 深色 -->
    <link rel="stylesheet" id="themeLight" href="../../src/styles/light.css" media="not all">
    <link rel="stylesheet" id="themeDark" href="../../src/styles/dark.css" media="all">
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <a id="home-link" href="../../index.html" aria-label="返回主页">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z"/></svg>
            </a>
            <button id="toc-toggle" aria-label="展开目录">
                <svg viewBox="0 0 16 16"><path d="M3 3.75h10a.75.75 0 010 1.5H3a.75.75 0 010-1.5zm2 4h8a.75.75 0 010 1.5H5a.75.75 0 010-1.5zm-2 4h10a.75.75 0 010 1.5H3a.75.75 0 010-1.5z"/></svg>
            </button>
        </div>
        <button id="theme-toggle" aria-label="切换主题">
            <svg viewBox="0 0 16 16"><path d="M9.598 1.591a.75.75 0 01.785-.175 7 7 0 11-8.967 8.967.75.75 0 01.961-.96 5.5 5.5 0 007.046-7.046.75.75 0 01.175-.786zm1.616 1.945a7 7 0 01-7.678 7.678 5.5 5.5 0 107.678-7.678z"></path></svg>
        </button>
    </div>
    <div class="page-body">
        <nav class="toc-sidebar" id="toc-sidebar"></nav>
        <div class="toc-overlay" id="toc-overlay"></div>
        <div class="post-wrapper">
            <article class="post-body">
            {{CONTENT}}
            </article>
        </div>
    </div>

<script>

    // ── 主题切换（与主页一致，默认深色） ──────────────────────────────
    // 切换时同步刷新 Mermaid 图表主题：还原原始源码、移除 data-processed、
    // 以新主题调用 mermaid.initialize() + mermaid.run() 重新渲染
    const lightSheet = document.getElementById('themeLight');
    const darkSheet = document.getElementById('themeDark');
    const hljsLight = document.getElementById('hljsLight');
    const hljsDark = document.getElementById('hljsDark');
    const themeToggle = document.getElementById('theme-toggle');

    const sunPath = "M8 10.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM8 12a4 4 0 100-8 4 4 0 000 8zM8 0a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0V.75A.75.75 0 018 0zm0 13a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 018 13zM2.343 2.343a.75.75 0 011.061 0l1.06 1.061a.75.75 0 01-1.06 1.06l-1.06-1.06a.75.75 0 010-1.06zm9.193 9.193a.75.75 0 011.06 0l1.061 1.06a.75.75 0 01-1.06 1.061l-1.061-1.06a.75.75 0 010-1.061zM16 8a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0116 8zM3 8a.75.75 0 01-.75.75H.75a.75.75 0 010-1.5h1.5A.75.75 0 013 8zm10.657-5.657a.75.75 0 010 1.061l-1.061 1.06a.75.75 0 11-1.06-1.06l1.06-1.06a.75.75 0 011.06 0zm-9.193 9.193a.75.75 0 010 1.06l-1.06 1.061a.75.75 0 11-1.061-1.06l1.06-1.061a.75.75 0 011.061 0z";
    const moonPath = "M9.598 1.591a.75.75 0 01.785-.175 7 7 0 11-8.967 8.967.75.75 0 01.961-.96 5.5 5.5 0 007.046-7.046.75.75 0 01.175-.786zm1.616 1.945a7 7 0 01-7.678 7.678 5.5 5.5 0 107.678-7.678z";

    function setIcon(path) {
        themeToggle.querySelector('svg path').setAttribute('d', path);
    }

    const saved = localStorage.getItem('theme') || 'dark';
    if (saved === 'light') {
        lightSheet.media = 'all';
        darkSheet.media = 'not all';
        hljsLight.media = 'all';
        hljsDark.media = 'not all';
        setIcon(sunPath);
    }

    themeToggle.addEventListener('click', () => {
        const isDark = darkSheet.media === 'all';
        lightSheet.media = isDark ? 'all' : 'not all';
        darkSheet.media = isDark ? 'not all' : 'all';
        hljsLight.media = isDark ? 'all' : 'not all';
        hljsDark.media = isDark ? 'not all' : 'all';
        setIcon(isDark ? sunPath : moonPath);
        localStorage.setItem('theme', isDark ? 'light' : 'dark');

        const mermaidFont = '"Open Sans", "PingFang SC", "Microsoft YaHei", sans-serif';

        // 切换主题时重新渲染 Mermaid 图表
        if (typeof mermaid !== 'undefined') {
            const mermaidTheme = isDark ? 'default' : 'dark';
            document.querySelectorAll('.mermaid').forEach(el => {
                el.removeAttribute('data-processed');
                el.innerHTML = el.getAttribute('data-original');
            });
            mermaid.initialize({ startOnLoad: false, theme: mermaidTheme, themeVariables: { fontFamily: mermaidFont } });
            mermaid.run();
        }
    });

{{MERMAID_SCRIPT}}

    // ── 页面内跳转：定位到顶栏下方 ────────────────────────────────────
    const topbar = document.querySelector('.topbar');

    function scrollToBelowTopbar(target) {
        const offset = topbar.getBoundingClientRect().height;
        window.scrollTo({ behavior: 'smooth', top: target.getBoundingClientRect().top + window.scrollY - offset });
    }

    document.querySelectorAll('.post-body a[href^="#"]').forEach(link => {
        link.addEventListener('click', e => {
            const id = link.getAttribute('href').slice(1);
            const target = document.getElementById(decodeURIComponent(id));
            if (target) { e.preventDefault(); scrollToBelowTopbar(target); }
        });
    });

    document.querySelectorAll('.footnote-backref').forEach(link => {
        link.addEventListener('click', e => {
            e.preventDefault();
            const target = document.getElementById(decodeURIComponent(link.getAttribute('href').slice(1)));
            if (target) scrollToBelowTopbar(target);
        });
    });

    // ── 目录生成与切换 ────────────────────────────────────────────────
    const tocToggle = document.getElementById('toc-toggle');
    const tocSidebar = document.getElementById('toc-sidebar');
    const tocListPath = "M3 3.75h10a.75.75 0 010 1.5H3a.75.75 0 010-1.5zm2 4h8a.75.75 0 010 1.5H5a.75.75 0 010-1.5zm-2 4h10a.75.75 0 010 1.5H3a.75.75 0 010-1.5z";
    const tocClosePath = "M2.72 2.72a.75.75 0 011.06 0L8 6.94l4.22-4.22a.75.75 0 011.06 1.06L9.06 8l4.22 4.22a.75.75 0 01-1.06 1.06L8 9.06l-4.22 4.22a.75.75 0 01-1.06-1.06L6.94 8 2.72 3.78a.75.75 0 010-1.06z";

    const postBody = document.querySelector('.post-body');
    const headings = postBody.querySelectorAll('h1, h2, h3, h4, h5, h6');

    let tocHTML = '';
    let idCounter = 0;
    headings.forEach(h => {
        if (!h.id) {
            h.id = 'heading-' + (++idCounter);
        }
        const level = parseInt(h.tagName[1]);
        const indent = 2 + (level - 1) * 1;
        tocHTML += `<a class="toc-item toc-level-${level}" href="#${h.id}" style="padding-left:${indent}rem">${h.textContent}</a>`;
    });

    if (tocHTML) {
        tocSidebar.innerHTML = `<div class="toc-title">目录</div>${tocHTML}`;
    }

    let tocOpen = false;
    const tocOverlay = document.getElementById('toc-overlay');

    function toggleToc() {
        tocOpen = !tocOpen;
        document.body.classList.toggle('toc-open', tocOpen);
        tocToggle.querySelector('svg path').setAttribute('d', tocOpen ? tocClosePath : tocListPath);
    }
    tocToggle.addEventListener('click', toggleToc);

    // 移动端：点击遮罩关闭目录
    if (tocOverlay) {
        tocOverlay.addEventListener('click', () => {
            if (tocOpen) toggleToc();
        });
    }

    // 点击目录项滚动到对应位置
    tocSidebar.querySelectorAll('.toc-item').forEach(item => {
        item.addEventListener('click', (e) => {
            e.preventDefault();
            const target = document.querySelector(item.getAttribute('href'));
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            // 移动端：点击目录项后自动关闭目录
            if (window.innerWidth < 600 && tocOpen) {
                toggleToc();
            }
        });
    });

    // 剥离 <pre> 内容中的 HTML 源码缩进
    document.querySelectorAll('pre[data-indent]').forEach(pre => {
        const spaces = parseInt(pre.dataset.indent) * 4;
        const prefix = ' '.repeat(spaces);
        pre.innerHTML = pre.innerHTML.split('\n').map(line => {
            if (line.startsWith(prefix)) return line.slice(spaces);
            return line;
        }).join('\n');
    });

    // 滚动监听：高亮当前目录项
    const tocItems = tocSidebar.querySelectorAll('.toc-item');
    function updateActiveToc() {
        let activeId = '';
        headings.forEach(h => {
            if (h.getBoundingClientRect().top <= 100) {
                activeId = h.id;
            }
        });
        tocItems.forEach(item => {
            item.classList.toggle('toc-active', item.getAttribute('href') === '#' + activeId);
        });
    }
    window.addEventListener('scroll', updateActiveToc);
    updateActiveToc();
</script>
</body>
</html>
