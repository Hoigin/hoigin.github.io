<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" id="themeLight" href="./src/styles/light.css" media="all">
    <link rel="stylesheet" id="themeDark" href="./src/styles/dark.css" media="not all">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.75rem;
            position: relative;
        }

        .avatar {
            width: 5rem;
            height: 5rem;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--avatar-border);
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .blog-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--title-color);
            border-bottom: none;
            margin: 0;
        }

        .state {
            color: var(--state-color);
            font-size: 0.85rem;
        }

        #dark-mode-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: transparent;
            border: none;
            padding: 0.25rem;
            font-size: 1.4rem;
            color: var(--toggle-color);
            cursor: pointer;
            transition: color 0.2s ease;
            z-index: 10;
            border-radius: 50%;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        #dark-mode-toggle:hover,
        #dark-mode-toggle:focus,
        #dark-mode-toggle:active {
            outline: none;
            background: transparent !important;
            box-shadow: none;
            color: var(--link-hover);
        }

        body {
            background-color: var(--page-bg);
            color: var(--page-text);
            line-height: 1.6;
            padding: 1.25rem;
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            box-shadow: 0 6px 20px var(--card-shadow);
            overflow: hidden;
            padding: 1.875rem;
            position: relative;
        }

        .post-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            font-size: 1rem;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-item:hover {
            color: var(--link-hover);
        }

        .post-title {
            color: var(--link-color);
            font-weight: bold;
        }

        .post-title::before {
            content: "📄 ";
            margin-right: 0.25rem;
        }

        .post-item:hover .post-title {
            color: var(--link-hover);
        }

        .post-date {
            color: var(--muted-color);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .no-posts {
            text-align: center;
            color: var(--muted-color);
            font-size: 1rem;
            padding: 1.25rem 0;
        }

        @media (max-width: 600px) {
            .card {
                padding: 1.125rem;
            }
            .avatar {
                width: 3.75rem;
                height: 3.75rem;
            }
            .blog-title {
                font-size: 1.4rem;
            }
            #dark-mode-toggle {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <img src="./resources/avatar.jpg" alt="Avatar" class="avatar">
                <div class="header-info">
                    <h1 class="blog-title">Hoigin's Blog</h1>
                    <div class="state">思维是发散的，只有写下来才会收敛成文字。</div>
                </div>
                <button id="dark-mode-toggle" aria-label="切换深色模式">☀️</button>
            </div>

            <div class="post-list">
                {{POST_LIST}}
            </div>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('dark-mode-toggle');
        const lightSheet = document.getElementById('themeLight');
        const darkSheet = document.getElementById('themeDark');

        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') {
            lightSheet.media = 'not all';
            darkSheet.media = 'all';
            themeToggle.textContent = '🌙';
        }

        themeToggle.addEventListener('click', () => {
            const isDark = darkSheet.media === 'all';
            lightSheet.media = isDark ? 'all' : 'not all';
            darkSheet.media = isDark ? 'not all' : 'all';
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        });
    </script>
</body>
</html>
