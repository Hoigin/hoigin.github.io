<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" id="themeLight" href="./src/styles/light.css" media="all">
    <link rel="stylesheet" id="themeDark" href="./src/styles/dark.css" media="not all">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.75rem;
            position: relative;
        }

        .avatar {
            width: 5rem;
            height: 5rem;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--avatar-border);
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .blog-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--title-color);
            border-bottom: none;
            margin: 0;
        }

        .state {
            color: var(--state-color);
            font-size: 0.85rem;
        }

        #theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: transparent;
            border: none;
            padding: 0.25rem;
            width: 1.5rem;
            height: 1.5rem;
            cursor: pointer;
            color: var(--toggle-color);
            transition: color 0.2s ease;
            z-index: 10;
            border-radius: 50%;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            appearance: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #theme-toggle svg {
            fill: currentColor;
            width: 1.25rem;
            height: 1.25rem;
        }

        #theme-toggle:hover {
            outline: none;
            background: transparent;
            color: var(--icon-link-hover);
        }

        body {
            background-color: var(--page-bg);
            color: var(--page-text);
            line-height: 1.6;
            padding: 1.25rem;
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            box-shadow: 0 6px 20px var(--card-shadow);
            overflow: hidden;
            padding: 1.875rem;
            position: relative;
        }

        .post-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            font-size: 1rem;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-item:hover {
            color: var(--title-link-hover);
        }

        .post-title {
            color: var(--link-color);
            font-weight: bold;
        }

        .post-title::before {
            content: "📄 ";
            margin-right: 0.25rem;
        }

        .post-item:hover .post-title {
            color: var(--title-link-hover);
        }

        .post-date {
            color: var(--muted-color);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .no-posts {
            text-align: center;
            color: var(--muted-color);
            font-size: 1rem;
            padding: 1.25rem 0;
        }

        @media (max-width: 600px) {
            .card {
                padding: 1.125rem;
            }
            .avatar {
                width: 3.75rem;
                height: 3.75rem;
            }
            .blog-title {
                font-size: 1.4rem;
            }
            #theme-toggle {
                width: 1.25rem;
                height: 1.25rem;
            }
            #theme-toggle svg {
                width: 1rem;
                height: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">    
        <div class="header">
            <img src="./resources/avatar.jpg" alt="Avatar" class="avatar">
            <div class="header-info">
                <h1 class="blog-title">Hoigin's Blog</h1>
                <div class="state">思维是发散的，只有写下来才会收敛成文字。</div>
            </div>
            <button id="theme-toggle" aria-label="切换主题">
                <svg viewBox="0 0 16 16"><path d="M8 10.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM8 12a4 4 0 100-8 4 4 0 000 8zM8 0a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0V.75A.75.75 0 018 0zm0 13a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 018 13zM2.343 2.343a.75.75 0 011.061 0l1.06 1.061a.75.75 0 01-1.06 1.06l-1.06-1.06a.75.75 0 010-1.06zm9.193 9.193a.75.75 0 011.06 0l1.061 1.06a.75.75 0 01-1.06 1.061l-1.061-1.06a.75.75 0 010-1.061zM16 8a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0116 8zM3 8a.75.75 0 01-.75.75H.75a.75.75 0 010-1.5h1.5A.75.75 0 013 8zm10.657-5.657a.75.75 0 010 1.061l-1.061 1.06a.75.75 0 11-1.06-1.06l1.06-1.06a.75.75 0 011.06 0zm-9.193 9.193a.75.75 0 010 1.06l-1.06 1.061a.75.75 0 11-1.061-1.06l1.06-1.061a.75.75 0 011.061 0z"></path></svg>
            </button>
        </div>
        <div class="card">
            <div class="post-list">
                {{POST_LIST}}
            </div>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const lightSheet = document.getElementById('themeLight');
        const darkSheet = document.getElementById('themeDark');

        const sunPath = "M8 10.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM8 12a4 4 0 100-8 4 4 0 000 8zM8 0a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0V.75A.75.75 0 018 0zm0 13a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 018 13zM2.343 2.343a.75.75 0 011.061 0l1.06 1.061a.75.75 0 01-1.06 1.06l-1.06-1.06a.75.75 0 010-1.06zm9.193 9.193a.75.75 0 011.06 0l1.061 1.06a.75.75 0 01-1.06 1.061l-1.061-1.06a.75.75 0 010-1.061zM16 8a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0116 8zM3 8a.75.75 0 01-.75.75H.75a.75.75 0 010-1.5h1.5A.75.75 0 013 8zm10.657-5.657a.75.75 0 010 1.061l-1.061 1.06a.75.75 0 11-1.06-1.06l1.06-1.06a.75.75 0 011.06 0zm-9.193 9.193a.75.75 0 010 1.06l-1.06 1.061a.75.75 0 11-1.061-1.06l1.06-1.061a.75.75 0 011.061 0z";
        const moonPath = "M9.598 1.591a.75.75 0 01.785-.175 7 7 0 11-8.967 8.967.75.75 0 01.961-.96 5.5 5.5 0 007.046-7.046.75.75 0 01.175-.786zm1.616 1.945a7 7 0 01-7.678 7.678 5.5 5.5 0 107.678-7.678z";

        function setIcon(path) {
            themeToggle.querySelector('svg path').setAttribute('d', path);
        }

        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') {
            lightSheet.media = 'not all';
            darkSheet.media = 'all';
            setIcon(moonPath);
        }

        themeToggle.addEventListener('click', () => {
            const isDark = darkSheet.media === 'all';
            lightSheet.media = isDark ? 'all' : 'not all';
            darkSheet.media = isDark ? 'not all' : 'all';
            setIcon(isDark ? sunPath : moonPath);
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        });
    </script>
</body>
</html>
